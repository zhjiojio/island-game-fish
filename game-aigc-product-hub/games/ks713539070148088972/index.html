<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>H5 快手小游戏</title>
<style>
  /* ── 浏览器调试：固定 360×812（竖屏默认），在浏览器视口居中 ── */
  html {
    width: 360px;
    height: 812px;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    box-shadow: 0 0 0 1px #444;
    transition: width 0.3s, height 0.3s, transform 0.3s;
  }
  html.landscape {
    width: 812px;
    height: 360px;
  }
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    touch-action: none;
    width: 100%;
    height: 100%;
  }

  /* ── 横竖屏切换按钮（手机框外，左上角） ── */
  #debug-rotate {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 99999;
    background: rgba(40,40,40,0.75);
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #fff;
    backdrop-filter: blur(4px);
    user-select: none;
  }
  #debug-rotate:hover { background: rgba(60,60,60,0.9); }
  #debug-rotate svg { width: 16px; height: 16px; transition: transform 0.3s; }
  html.landscape #debug-rotate svg { transform: rotate(90deg); }
</style>
</head>
<body>
<canvas id="gameCanvas" style="display:block"></canvas>

<!-- 横竖屏切换按钮（浏览器窗口左上角，不在手机框内） -->
<button id="debug-rotate" title="切换横/竖屏" onclick="toggleOrientation()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="2" width="14" height="20" rx="2"/>
    <line x1="12" y1="18" x2="12" y2="18.5" stroke-width="2.5"/>
  </svg>
  <span id="debug-rotate-label">竖屏</span>
</button>

<script>
window.canvas = document.getElementById('gameCanvas');

// 将固定分辨率写入 html 属性，供 main.js 浏览器调试时读取
var _debugHtml = document.documentElement;
_debugHtml.setAttribute('data-debug-w', '360');
_debugHtml.setAttribute('data-debug-h', '812');

function toggleOrientation() {
  var isLandscape = _debugHtml.classList.toggle('landscape');
  // 横竖屏互换 w/h，保持与 CSS 同步
  _debugHtml.setAttribute('data-debug-w', isLandscape ? '812' : '360');
  _debugHtml.setAttribute('data-debug-h', isLandscape ? '360' : '812');
  document.getElementById('debug-rotate-label').textContent = isLandscape ? '横屏' : '竖屏';
  // 通知 main.js 重算 canvas 尺寸
  window.dispatchEvent(new Event('resize'));
}
</script>
