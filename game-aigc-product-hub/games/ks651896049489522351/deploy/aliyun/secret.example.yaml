# ============================================================
# 正式环境（阿里云 ACK）Secret 模板
# ------------------------------------------------------------
# 【本文件只是模板，禁止填入真实值后提交】
# 真实 Secret 由阿里云 KMS / 凭据管家托管，或用 kubectl 直接创建：
#
#   kubectl -n <namespace> create secret generic ddz-prod-secret \
#     --from-literal=DDZ_AUTH_SECRET='...' \
#     --from-literal=DDZ_MYSQL_PASSWORD='...' \
#     --from-literal=DDZ_KWAI_APP_SECRET='...' \
#     --from-literal=DDZ_KWAI_PAY_SIGN_KEY='...' \
#     --from-literal=DDZ_KWAI_PAY_NOTIFY_KEY='...'
#
# 注意：DDZ_AUTH_SECRET 更换后所有已签发 token 立即失效（线上玩家需重登），
# 不要当成常规轮换项处理。
#
# ---- /admin 管理后台（默认不注入，按需开）----
# ADMIN_TOKEN / ADMIN_ALLOW_REMOTE 刻意不列在上面的 create 命令里：
#   未设置 ADMIN_TOKEN → server/index.js 不注册 /admin 路由 → 一律 404，
#   后台等于不存在，这是线上默认（也最安全）的状态。
# 只在临时给运营/测试改数据时按需注入，用完立刻撤销：
#
#   kubectl -n default set env statefulset/ltddz-server-prod \
#     ADMIN_TOKEN="$(openssl rand -hex 24)" ADMIN_ALLOW_REMOTE=1
#   #   密码框能打开但一直 403 → 来源 IP 被 SLB/网关吞了，
#   #   需把代理出口 IP 配进 DDZ_TRUSTED_PROXY_IPS，否则限流也会退化成全局共用
#   # 用完撤销（pod 滚动重启，回到 404）：
#   kubectl -n default set env statefulset/ltddz-server-prod \
#     ADMIN_TOKEN- ADMIN_ALLOW_REMOTE-
#
# 不要写进 ConfigMap 或本 Secret 长期生效：admin 能改余额、封号，
# 常驻等于把后台挂在公网上，必须「按需开、用完关」。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ddz-prod-secret
  namespace: ddz
type: Opaque
stringData:
  DDZ_AUTH_SECRET: "__INJECT_FROM_KMS__"
  DDZ_MYSQL_PASSWORD: "__INJECT_FROM_KMS__"
  DDZ_KWAI_APP_SECRET: "__INJECT_FROM_KMS__"
  DDZ_KWAI_PAY_SIGN_KEY: "__INJECT_FROM_KMS__"
  DDZ_KWAI_PAY_NOTIFY_KEY: "__INJECT_FROM_KMS__"
  DOUZERO_APPROVED_MANIFEST_SHA256: "__INJECT_FROM_ARTIFACT__"
