[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ddz-douzero-sidecar"
version = "0.1.0"
description = "Private ONNX candidate-scoring sidecar for the DDZ game server"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "numpy==2.2.6",
  "onnxruntime==1.22.0",
  "uvicorn[standard]==0.34.3"
]

[tool.setuptools]
py-modules = ["app", "capacity", "features", "inference", "model_fetcher"]
